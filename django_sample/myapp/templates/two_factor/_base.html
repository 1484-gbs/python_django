<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>{% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="//cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"
        media="screen">
    <script defer src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script defer src="//cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.2/js/bootstrap.min.js"></script>
    {% block extra_media %}{% endblock %}
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-5 offset-md-3">
                {% block content %}
                {% block two_factor_content %}{% endblock %}
                {% endblock %}
            </div>
        </div>
    </div>
</body>

</html>
